{% extends "base.html" %}
{% block title %}Scoring{% endblock %}
{% block content %}

<div class="max-w-7xl mx-auto p-5">
  <h1 class="text-3xl text-white mb-5">Scoring Tuner</h1>

  <form hx-post="{% url 'tune-scoring' %}"
        hx-trigger="submit"
        hx-target="#scoring-results">
    {% csrf_token %}
    <input type="text" 
           name="seller" 
           placeholder="Enter seller name"
           class="px-4 py-2 border rounded mr-2 bg-gray-800 text-white border-gray-700">
    <button type="submit" 
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
      Get Records
    </button>
  </form>

  <div id="scoring-results">
    <p class="text-gray-300">Enter a seller name to get records for scoring</p>
  </div>
</div>

{% endblock %}
