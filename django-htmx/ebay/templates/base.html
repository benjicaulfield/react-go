<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LongPlaying{% endblock %}</title>
    
    {% load static %}
    {% load tailwind_tags %}
    {% tailwind_css %}
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-black font-mono text-gray-200">
    <header class="w-full px-5 py-3 bg-white text-black fixed top-0 left-0 flex justify-between items-center z-50">
        <div class="flex gap-4">
            <a href="{% url 'home' %}" class="text-black font-bold">LongPlaying</a>
        </div>
    </header>
    
    <nav class="bg-gray-800 p-4 mt-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-white text-lg font-bold">Home</a>
            <div class="flex space-x-4">
                <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white">Dashboard</a>
                <a href="{% url 'by-seller' %}" class="text-gray-300 hover:text-white">By Seller</a>
                <a href="{% url 'seller-trigger' %}" class="text-gray-300 hover:text-white">Trigger</a>
                <a href="{% url 'scoring' %}" class="text-gray-300 hover:text-white">Scoring</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-20">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
