{% extends "base.html" %}
{% block title %}Seller Trigger{% endblock %}
{% block content %}
    <h1 class="text-3xl text-white mb-5">Trigger Scraper</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="seller" placeholder="Enter seller username"
               class="px-4 py-2 border rounded mr-2 bg-gray-800 text-white border-gray-700">
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Start Scrape
        </button>
    </form>
{% endblock %}
