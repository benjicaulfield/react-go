[supervisord]
nodaemon=true
user=root

[program:go-backend]
command=/app/bin/server
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/go-backend.err.log
stdout_logfile=/var/log/go-backend.out.log

[program:python-recommendation]
command=python3 /app/python-services/recommendation-service.py
directory=/app/python-services
autostart=true
autorestart=true
stderr_logfile=/var/log/python-recommendation.err.log
stdout_logfile=/var/log/python-recommendation.out.log

[program:python-scraper]
command=python3 /app/python-services/scraper-service.py
directory=/app/python-services
autostart=true
autorestart=true
stderr_logfile=/var/log/python-scraper.err.log
stdout_logfile=/var/log/python-scraper.out.log

[program:react-frontend]
command=npx serve -s /app/frontend/dist -l 3000
directory=/app/frontend
autostart=true
autorestart=true
stderr_logfile=/var/log/react-frontend.err.log
stdout_logfile=/var/log/react-frontend.out.log
